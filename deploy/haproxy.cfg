# /etc/haproxy/haproxy.cfg on Lb01. Replace the placeholder IPs with Web01 and Web02.
global
    log /dev/log local0
    maxconn 2048
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend acquah_front
    bind *:80
    default_backend acquah_web

backend acquah_web
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web01 WEB01_IP:80 check
    server web02 WEB02_IP:80 check
